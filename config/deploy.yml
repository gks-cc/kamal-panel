# 面板自身的部署配置：https://kamal.gks.cc（121.40.124.141，与 ant-tree / rd-sync / apexpm 同机，
# 共用一个 kamal-proxy）。部署分支是 gks（main 保持与上游同步），push gks 后由 .github/workflows/kamal_deploy.yml 自动部署；
# 本地手动部署用 bin/kamal-prod deploy（加载不入库的 .env.production）。
#
# ⚠️ 不要把面板加进它自己的托管应用列表：面板重启自己会在命令中途把自己杀掉，审计永远停在 pending，
#    还会在主机上留下部署锁，需要手动 kamal lock release。
service: kamal-panel

image: gkscc/kamal-panel

# 面板是单节点：数据在 SQLite 里，Solid Queue 跑在 Puma 进程内，只能有一台 web。
servers:
  web:
    hosts:
      - 121.40.124.141
    options:
      # 服务器约 2 核 1.7GiB，与多个应用共用。每次解析 deploy.yml 会起 Ruby 子进程（硬超时 5 秒），
      # 0.5 核下十几个应用并发采集会频繁「解析超时」，所以给到 1 核。
      memory: 640m
      cpus: 1

proxy:
  ssl: true
  host: kamal.gks.cc
  # thruster 监听 80，转发给容器内的 puma
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 60

registry:
  server: registry.cn-hongkong.aliyuncs.com
  username: hi35360296@aliyun.com
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    # SSH 私钥等凭据用 Active Record encryption 加密入库；这三个值丢了，库里已加密的凭据将永久无法解密。
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
  clear:
    SOLID_QUEUE_IN_PUMA: true
    PANEL_URL: https://kamal.gks.cc
    TZ: Asia/Shanghai

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# SQLite 数据库与 Active Storage 都在这个卷里，**含加密后的 SSH 私钥**，备份按服务器访问凭据级别对待。
volumes:
  - "kamal_panel_storage:/rails/storage"

asset_path: /rails/public/assets

logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

ssh:
  user: root

builder:
  arch: amd64
  # 阿里云 ACR 不支持 OCI attestation manifest，必须关闭
  provenance: false
  sbom: false
