default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  # One worker per kind of work, so a slow kind can't take the threads the others need. Actions
  # (deploy, rollback, ...) hold a thread for up to the CLI timeout (10 minutes); with a single shared
  # pool, two deploys plus a slow poll used to stop status collection and alerting exactly when a
  # deploy goes wrong. Keep config/database.yml's pool in step (it adds all three thread counts).
  workers:
    # Alert rule evaluation and notification delivery: database reads and short HTTP calls.
    - queues: [ alerts ]
      threads: <%= ENV.fetch("ALERT_THREADS", 1) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    # Status polls, metric samples and log-keyword scans (SSH), plus housekeeping.
    - queues: [ collect, default ]
      threads: <%= ENV.fetch("JOB_THREADS", 3) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    # Kamal actions. Each one runs a kamal subprocess (~100–150 MB), so this also caps how many run
    # at once against the container's memory limit.
    - queues: [ actions ]
      threads: <%= ENV.fetch("ACTION_THREADS", 2) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
